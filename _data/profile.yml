bio_en: >-
  I print three-dimensional micro- and nanoscale architectures from colloidal
  nanoparticles with meniscus-guided 3D nanoprinting, and turn them into
  plasmonic SERS substrates and electrochemical biosensors. I work with
  Prof. Jong-Min Lee at AMGL, where I also run the lab's day-to-day operations.
  Outside the lab I lead BioSync, a pre-incorporation startup building on-farm
  biosensors for dairy herds.
bio_ko: >-
  콜로이드 나노입자를 메니스커스 유도 3D 나노프린팅으로 3차원 마이크로·나노
  구조체로 만들고, 이를 플라즈모닉 SERS 기판과 전기화학 바이오센서로 발전시키는
  연구를 합니다. AMGL(이종민 교수 연구실)에서 랩장으로 연구실 운영을 함께 맡고
  있으며, 연구실 밖에서는 낙농가용 현장 진단 바이오센서를 만드는 예비창업팀
  BioSync를 이끌고 있습니다.

