# ── 연구 분야 ───────────────────────────────────────────────────
research:
  - title_en: Meniscus-guided 3D nanoprinting
    title_ko: 메니스커스 유도 3D 나노프린팅
    text_en: >-
      Direct printing of free-standing micro- and nanoscale architectures from
      functional colloids: gold nanoparticles, PEDOT:PSS, upconversion
      nanoparticles, and CNT composites.
    text_ko: >-
      금 나노입자, PEDOT:PSS, 상향변환 나노입자, CNT 복합체 같은 기능성 콜로이드로
      스스로 서 있는 3차원 미세 구조체를 직접 인쇄합니다.
  - title_en: Plasmonic nanostructures and SERS
    title_ko: 플라즈모닉 나노구조와 SERS
    text_en: >-
      Uniform, low-cost SERS substrates built from nanoparticle assemblies, and
      laser sintering of printed gold architectures.
    text_ko: >-
      나노입자 집합체로 균일하고 값싼 SERS 기판을 만들고, 인쇄한 금 구조체를
      레이저로 소결하는 공정을 다룹니다.
  - title_en: Electrochemical and optical biosensors
    title_ko: 전기화학·광학 바이오센서
    text_en: >-
      Printed nanoparticle electrodes and SERS platforms for point-of-need
      detection in health, livestock, and environmental samples.
    text_ko: >-
      인쇄한 나노입자 전극과 SERS 플랫폼으로 건강, 축산, 환경 시료를 현장에서
      검출하는 센서를 개발합니다.

